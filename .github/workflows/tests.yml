name: Static regression checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: static-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run static regression suite
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/*.cjs; do
            if [ "$test" = "tests/analytics-provider.cjs" ]; then
              echo "↷ $test (requires a separately downloaded official Umami tracker fixture)"
              continue
            fi
            echo "→ $test"
            node "$test"
          done
