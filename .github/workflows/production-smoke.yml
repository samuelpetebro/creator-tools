name: Production smoke checks

on:
  schedule:
    - cron: "17 10 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Wait for matching GitHub Pages deployment
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          for i in {1..72}; do
            json="$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=20")"

            row="$(printf '%s' "$json" | jq -r '
              .workflow_runs[]
              | select(.name == "pages build and deployment")
              | [.status, (.conclusion // "")]
              | @tsv
            ' | head -n 1)"

            if [ -z "$row" ]; then
              echo "Attempt $i: matching Pages run not visible yet"
              sleep 5
              continue
            fi

            status="$(printf '%s' "$row" | cut -f1)"
            conclusion="$(printf '%s' "$row" | cut -f2)"

            echo "Attempt $i: Pages status=$status conclusion=\${conclusion:-pending}"

            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "Matching Pages deployment completed successfully."
                exit 0
              fi
              echo "Matching Pages deployment failed with conclusion: $conclusion"
              exit 1
            fi

            sleep 5
          done

          echo "Timed out waiting for the Pages deployment for $GITHUB_SHA"
          exit 1

      - name: Verify deployed production
        env:
          DROOP_BASE_URL: https://droopweb.lat
        run: node tests/production-smoke.mjs
