name: Generate PWA icons once

on:
  push:
    branches:
      - pwa/mobile-installability

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pwa/mobile-installability

      - name: Install SVG rasterizer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin imagemagick

      - name: Generate non-transparent PWA icons
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p icons .tmp-icons
          rsvg-convert -w 154 -h 154 favicon.svg > .tmp-icons/fav154.png
          rsvg-convert -w 410 -h 410 favicon.svg > .tmp-icons/fav410.png
          rsvg-convert -w 350 -h 350 favicon.svg > .tmp-icons/fav350.png
          rsvg-convert -w 148 -h 148 favicon.svg > .tmp-icons/fav148.png

          convert -size 192x192 xc:'#eef8ff' .tmp-icons/fav154.png -gravity center -composite -depth 8 -colors 128 -strip icons/icon-192.png
          convert -size 512x512 xc:'#eef8ff' .tmp-icons/fav410.png -gravity center -composite -depth 8 -colors 128 -strip icons/icon-512.png
          convert -size 512x512 xc:'#eef8ff' .tmp-icons/fav350.png -gravity center -composite -depth 8 -colors 128 -strip icons/icon-maskable-512.png
          convert -size 180x180 xc:'#eef8ff' .tmp-icons/fav148.png -gravity center -composite -depth 8 -colors 128 -strip icons/apple-touch-icon.png
          identify icons/*.png

      - name: Commit generated icons
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/*.png
          git commit -m "Add raster PWA icons"
          git push origin HEAD:pwa/mobile-installability
